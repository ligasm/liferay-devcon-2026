[#assign variant = configuration.variant!"dark" /]
[#assign image = configuration.image!"hero-migrate" /]
<section class="pq-hero pq-hero--${variant} pq-hero--${configuration.size!"large"}" style="background-image: url('{{DOCS}}/${image}-jpg');">
	<div class="pq-hero__inner">
		<span class="pq-eyebrow" data-lfr-editable-id="eyebrow" data-lfr-editable-type="text">Proventeq</span>
		<h1 class="pq-h1" data-lfr-editable-id="title" data-lfr-editable-type="rich-text">Intelligent content, ready for AI</h1>
		<p class="pq-lead" data-lfr-editable-id="lead" data-lfr-editable-type="text">Lead paragraph.</p>
		<div class="pq-hero__actions">
			<a class="pq-btn pq-btn--primary" href="#" data-lfr-editable-id="cta1" data-lfr-editable-type="link">Talk to us</a>
			<a class="pq-btn pq-btn--ghost" href="#" data-lfr-editable-id="cta2" data-lfr-editable-type="link">Learn more</a>
		</div>
	</div>
</section>
