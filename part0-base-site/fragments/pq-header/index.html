<header class="pq-header">
	<div class="pq-header__inner">
		<a class="pq-header__logo" href="{{SITE}}/home" aria-label="Proventeq home">
			<img src="{{LOGO_URL}}" alt="Proventeq" width="139" height="34" />
		</a>
		<button class="pq-header__toggle" type="button" aria-expanded="false">Menu</button>
		<nav class="pq-nav" aria-label="Main">
{{NAV}}
		</nav>
		<form class="pq-header__search" action="{{SITE}}/search" method="get" role="search">
			<input name="q" type="search" placeholder="Search" aria-label="Search the site" />
			<button type="submit" aria-label="Search">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
			</button>
		</form>
		<a class="pq-btn pq-btn--primary pq-header__cta" href="{{SITE}}/contact" data-lfr-editable-id="cta" data-lfr-editable-type="link">Talk to us</a>
	</div>
</header>
