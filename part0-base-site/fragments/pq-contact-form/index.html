<form class="pq-form" action="#" onsubmit="return false;">
	<h3 class="pq-h3" data-lfr-editable-id="title" data-lfr-editable-type="text">Send us a message</h3>
	<p class="pq-form__note" data-lfr-editable-id="note" data-lfr-editable-type="text">We usually reply within one business day.</p>
	<div class="pq-form__grid">
		<label>First name<input type="text" name="firstName" autocomplete="given-name" /></label>
		<label>Last name<input type="text" name="lastName" autocomplete="family-name" /></label>
		<label>Work email<input type="email" name="email" autocomplete="email" /></label>
		<label>Company<input type="text" name="company" autocomplete="organization" /></label>
		<label class="pq-form__full">How can we help?<textarea name="message" rows="5"></textarea></label>
	</div>
	<button class="pq-btn pq-btn--primary" type="submit">Send message</button>
	<p class="pq-form__demo">Demo form &mdash; submissions go nowhere on this test instance.</p>
</form>
