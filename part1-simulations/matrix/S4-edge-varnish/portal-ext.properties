##
## S4 — Edge guest-HTML cache. Layer on top of S3.
## Liferay-side changes are small: it has to know it is behind a proxy, and it
## has to stop telling shared caches "no".
##

# Already set in S3 — repeated because S4 does not work without them:
browser.cache.disabled=false
browser.cache.signed.in.disabled=true

# Liferay behind a reverse proxy / TLS terminator: generate absolute URLs with
# the public scheme and port (otherwise redirects and canonical URLs point at
# http://host:8080). Pair with Tomcat's RemoteIpValve (server.xml.snippet).
web.server.protocol=https
web.server.https.port=443
web.server.http.port=80
# UNVERIFIED — check learn.liferay.com: web.server.host if the public host name
# differs from the request Host header (usually leave unset).
#web.server.host=www.example.com

# Optional: emit cache tags so Varnish (xkey) / Cloudflare can purge by tag.
# Liferay has no built-in Surrogate-Key header; S5 shows a servlet filter /
# ModelListener sketch that adds  Cache-Tag: layout-<plid>,site-<groupId>,article-<id>
