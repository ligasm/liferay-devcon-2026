# S6 local lab: serve part2-static-prototype/dist-proventeq on :8090 under the same
# URL layout the k6 scripts use for Liferay (/web/proventeq/<page>), so every scenario
# runs unchanged. nginx (not tools/serve.mjs) so the file server is not the bottleneck.
worker_processes auto;
events { worker_connections 4096; }
http {
	include       /etc/nginx/mime.types;
	sendfile      on;
	tcp_nopush    on;
	keepalive_timeout 65;
	access_log    off;
	gzip          on;
	gzip_types    text/css application/javascript application/json image/svg+xml;

	server {
		listen 8090;
		root /usr/share/nginx/html;

		add_header Cache-Control "public, max-age=60" always;

		# /web/proventeq/home is the static site root; /search?q= is the Pagefind shell
		location = /web/proventeq/home { rewrite ^ / last; }
		location = /web/proventeq/home/ { rewrite ^ / last; }
		location /web/proventeq/ {
			rewrite ^/web/proventeq/?(.*)$ /$1 last;
		}
		location / {
			try_files $uri $uri/index.html $uri.html =404;
		}
	}
}
