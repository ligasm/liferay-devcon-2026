##
## S3 — Front-end delivery: static assets to a CDN, cacheable D&M, images.
## Layer on top of S2.
##

# --- CDN host for static assets (theme CSS/JS, /o/ bundles, /combo). The value
# MUST include the protocol. Instance Settings → General → CDN Host HTTPS overrides
# this (stored in PortalPreferences), so set it in one place only.
# Disable at runtime for debugging with ?cdn_enabled=0.
cdn.host.http=http://cdn.example.com
cdn.host.https=https://cdn.example.com

# Also send dynamically generated CSS/JS (/combo, /o/js/resolved-module…) through
# the CDN. Set to FALSE only for origin-pull CDNs that do not lazily fetch
# (the docs name CloudFront) — getting this wrong yields 404s on combo URLs and a
# site with no styling.
cdn.dynamic.resources.enabled=true

# --- What cdn.host.* does NOT cover (by design): page HTML, /documents/*,
# /o/adaptive-media/*, portlet resource URLs, Headless APIs. Those need S4.

# --- Browser cache for rendered HTML. Out of the box every page is
#   Cache-Control: private, no-cache, no-store, must-revalidate
# which also makes every shared cache (Varnish/Cloudflare) refuse to store it.
# Flip the guest side, keep the signed-in side (back-button-after-logout safety):
browser.cache.disabled=false
browser.cache.signed.in.disabled=true
# NOTE: affects only HTML from MainServlet; CSS/JS/image servlets set their own
# headers. With browser.cache.disabled=false Liferay stops sending no-store for
# guests — it does NOT add max-age. The edge (S4) sets the TTL.

# --- HTTP filters: ETag/Header filters stay on (they set Last-Modified/ETag on
# static resources); compression stays at the proxy.
com.liferay.portal.servlet.filters.etag.ETagFilter=true
com.liferay.portal.servlet.filters.header.HeaderFilter=true
com.liferay.portal.servlet.filters.gzip.GZipFilter=false

# --- Documents & Media previews/thumbnails out of the JVM (keep the default)
dl.file.entry.preview.fork.process.enabled=true
