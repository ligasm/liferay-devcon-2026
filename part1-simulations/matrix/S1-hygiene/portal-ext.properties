##
## S1 — Hygiene.
## Everything here is either (a) making sure a dev-only setting did not leak into
## production, or (b) turning off work Liferay does on every request for no
## production benefit. Expect a small, measurable win (single-digit % on p95 and
## CPU) — the point of this stage is what is NOT in it.
##

# (a) THE most common production mistake: portal-developer.properties leaking in.
# It flips theme.css.fast.load / javascript.fast.load / minifier etc. to their
# debug values all at once. Make sure this line is absent or commented out:
#include-and-override=portal-developer.properties

# Belt and braces — these are the production defaults; stating them guards
# against an inherited portal-ext.properties that set them to false.
javascript.fast.load=true
theme.css.fast.load=true
theme.images.fast.load=true

# (b) Session tracker: every click of every live session kept in heap purely to
# populate the "Live Sessions" admin screen. Deprecated, default true. Turn it off.
session.tracker.memory.enabled=false
session.tracker.persistence.enabled=false

# Do not reindex the whole search index on every restart (already the default
# since 7.x — listed because old checklists still tell people to "check it").
index.on.startup=false

# Compression belongs at the proxy/edge (brotli), not in the JVM. Both filters
# default to false; keep them that way.
com.liferay.portal.servlet.filters.gzip.GZipFilter=false
com.liferay.portal.servlet.filters.strip.StripFilter=false

# Runtime CSS minification is deprecated and defaults to false — minification
# happens at build time. Leave it off; setting it to true only burns CPU.
minifier.enabled=false

# ---------------------------------------------------------------------------
# DEAD ADVICE — do NOT add these; they either no longer exist or do nothing:
#   layout.parallel.render.enable=true      → property removed in 7.3
#   com.liferay.portal.servlet.filters.cache.CacheFilter=true → filter deleted in 7.4.3.123
#   ehcache.cluster.link.replication.enabled=true → unnecessary since DXP 7.0, ignored
#   ehcache.statistics.enabled=true         → 6.x-era, ignored
#   javascript.barebone.files=…             → deprecated, ships empty (BND headers now)
#   -XX:+UseConcMarkSweepGC                 → CMS removed in JDK 14; the flag is fatal from JDK 15
# ---------------------------------------------------------------------------
