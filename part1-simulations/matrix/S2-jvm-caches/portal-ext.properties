##
## S2 — JVM caches, connection pool, Cluster Link.
## Layer on top of S1-hygiene/portal-ext.properties.
##

# --- Ehcache 3 (DXP 2025.Q2+, LPD-40485). Override files live on the classpath:
#   tomcat/webapps/ROOT/WEB-INF/classes/ehcache/liferay-multi-vm-override.xml
# Do NOT name your file liferay-multi-vm.xml — that name exists inside the cache
# bundle JAR and produces "NullPointerException: Configuration path is null".
# Value is classpath-relative, not a filesystem path.
ehcache.multi.vm.config.location=/ehcache/liferay-multi-vm-override.xml
#ehcache.single.vm.config.location=/ehcache/liferay-single-vm-override.xml

# Entity/finder cache writes land at commit (default true) — keep.
transactional.cache.enable=true

# --- Cluster Link: invalidation, NOT replication.
# Turning this on makes every node broadcast *remove* messages when an entity
# changes; the receiving node drops its copy and re-reads from the DB on the next
# request. Values are not shipped across the wire (replicatePutsViaCopy=false).
cluster.link.enabled=true
# Multicast is unavailable in most clouds → unicast TCP with JDBC_PING (the DB is
# the rendezvous point, nodes can come and go — unlike TCP_PING).
cluster.link.channel.properties.control=${liferay.home}/jgroups/jdbc_ping.xml
cluster.link.channel.properties.transport.0=${liferay.home}/jgroups/jdbc_ping.xml
# Set autodetect to <db-host>:<port> so the bind address is the NIC that reaches the DB
cluster.link.autodetect.address=db:3306
# JGroups MBeans → watch messages/s on liferay-channel-transport-0
# (cluster.link.jmx.enabled is absent from 2026.q1.12, so it is not set here.)
# UNVERIFIED — check learn.liferay.com: the KB "Managing distributed cache in
# Liferay DXP" shows [CONFIG_FILE_PATH]/jdbc_ping_config.xml; ${liferay.home}
# expansion in this property is what the docs show for other properties, confirm
# for your release or use an absolute path.

# DO NOT switch caches to replication "because it's a cluster":
#ehcache.replicator.properties.<cache name>=replicatePutsViaCopy=true,replicateUpdatesViaCopy=true
# That serialises every cached value onto the network on every put. Invalidation
# (the default) is what you want; the shipped exceptions already say so:
#   ehcache.replicator.properties.com.liferay.journal.util.JournalContent=replicatePuts=false

# --- HikariCP. "Slightly larger than the Tomcat thread pool" (Tuning Liferay),
# because nested @Transactional boundaries can hold two connections per request.
# The shipped default is 180, so this LOWERS the pool. HikariCP's deadlock floor is
# maxThreads + 1 (76 for maxThreads=75). Size from monitoring: com.zaxxer.hikari:type=Pool
# → ThreadsAwaitingConnection in JMX, >0 sustained = the pool is exhausted (check slow
# queries and cache misses too).
jdbc.default.maximumPoolSize=150
jdbc.default.minimumIdle=10
jdbc.default.connectionTimeout=30000
jdbc.default.idleTimeout=600000
# 0 = live forever; must be shorter than your DB/proxy idle-kill timeout (MySQL wait_timeout, RDS Proxy) — e.g. 1800000
jdbc.default.maxLifetime=0
jdbc.default.registerMbeans=true

# MySQL driver flags from the shipped commented-out example URL (cachePrepStmts matters):
#jdbc.default.url=jdbc:mysql://db/lportal?cachePrepStmts=true&characterEncoding=UTF-8&dontTrackOpenResources=true&holdResultsOpenOverStatementClose=true&useFastDateParsing=false&useUnicode=true

# The Counter data source has its own small pool; it is never nested, keep it small.
# UNVERIFIED — check learn.liferay.com for the counter pool property names
#counter.jdbc.prefix=jdbc.counter.
#jdbc.counter.maximumPoolSize=10

# --- Hibernate: keep the defaults, confirm nobody left statistics/show_sql on.
hibernate.show_sql=false
hibernate.generate_statistics=false
hibernate.jdbc.batch_size=2000
