##
## S0 — Baseline. Stock Liferay DXP 2025.Q3+ / CE 7.4 on Tomcat.
##
## This file is intentionally (almost) empty: S0 means "whatever the bundle ships
## with". The values below are the SHIPPED DEFAULTS from portal.properties, listed
## so the audience can see what the later stages change. Do not copy them into a
## real portal-ext.properties — they are already in effect.
##
## Verified against portal-impl/src/portal.properties (liferay-portal master).

# Every rendered HTML page carries
#   Cache-Control: private, no-cache, no-store, must-revalidate
# and Set-Cookie: JSESSIONID / COOKIE_SUPPORT / SERVER_ID — for guests too.
#browser.cache.disabled=true
#browser.cache.signed.in.disabled=true

# No CDN prefix on static assets
#cdn.host.http=
#cdn.host.https=
#cdn.dynamic.resources.enabled=true

# Runtime CSS minification is deprecated and OFF (build-time minification instead)
#minifier.enabled=false

# Compression filters are OFF by default — compress at the proxy
#com.liferay.portal.servlet.filters.gzip.GZipFilter=false
#com.liferay.portal.servlet.filters.strip.StripFilter=false

# Single node, no Cluster Link
#cluster.link.enabled=false

# HikariCP defaults
#jdbc.default.maximumPoolSize=180
#jdbc.default.minimumIdle=10
#jdbc.default.connectionTimeout=30000
#jdbc.default.idleTimeout=600000
#jdbc.default.maxLifetime=0
#jdbc.default.registerMbeans=true

# Ehcache 3 (since DXP 2025.Q2, LPD-40485) config locations
#ehcache.single.vm.config.location=/ehcache/liferay-single-vm.xml
#ehcache.multi.vm.config.location=/ehcache/liferay-multi-vm.xml

# Session tracker keeps every click of every live session in heap. Default is
# still TRUE (and the property is marked deprecated in portal.properties).
#session.tracker.memory.enabled=true
#session.tracker.persistence.enabled=false

# Full reindex on start is already OFF by default (the classic advice is stale)
#index.on.startup=false
#index.on.startup.delay=60

# Properties you will still find in old tuning guides that NO LONGER EXIST in
# portal.properties on master (grep to confirm):
#   layout.parallel.render.enable / layout.parallel.render.timeout   (removed in 7.3)
#   com.liferay.portal.servlet.filters.cache.CacheFilter               (deleted in 7.4.3.123, LPS-*)
#   ehcache.cluster.link.replication.enabled, ehcache.statistics.enabled
#   javascript.barebone.files (deprecated, ships empty)
