# The same TLS + HTTP/2 front for every target, so that Lighthouse compares the sites and not
# the protocols. Without it a browser reaches Varnish and the static nginx over HTTP/1.1, which
# penalises a 56-request page more than any real CDN would.
#
# It only forwards: no compression (the targets already send gzip) and no caching.
worker_processes 2;
events { worker_connections 4096; }
http {
	access_log off;
	gzip off;

	ssl_certificate     /etc/nginx/certs/lab.crt;
	ssl_certificate_key /etc/nginx/certs/lab.key;
	ssl_protocols       TLSv1.3;
	http2 on;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $http_host;
	proxy_buffer_size 64k;
	proxy_buffers 16 64k;

	# Liferay writes absolute links to some of its CSS. These two headers, with Tomcat's
	# RemoteIpValve (valve.sh), make those links https://localhost:<port>, as in production.
	# Upgrading them with a CSP header instead left phantom http:// requests in Lighthouse's model.
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-Port $server_port;

	upstream edge   { server 127.0.0.1:6081; keepalive 64; }
	upstream static { server 127.0.0.1:8091; keepalive 64; }

	server { listen 9443 ssl; location / { proxy_pass http://edge; } }
	server { listen 9444 ssl; location / { proxy_pass http://static; } }
}
